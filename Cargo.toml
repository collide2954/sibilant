[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/collide2954/sibilant"
publish = false

[workspace.dependencies]
fontdb = { version = "0.23.0", default-features = false, features = ["std"] }
iced = { version = "0.14.0", default-features = false, features = [
    "crisp",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
] }
iced_test = "0.14.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sibilant-ui = { path = "crates/sibilant-ui" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
